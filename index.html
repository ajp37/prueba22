<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tiya Jesupas Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 30px;
        }

        .titulo {
            font-size: 40px;
        }

        .centro {
            margin-top: 40px;
            font-size: 80px;
            animation: flotar 3s infinite ease-in-out;
        }

        .texto {
            font-size: 30px;
            margin-top: 10px;
            font-weight: bold;
        }

        .producto, .carrito {
            background-color: white;
            margin: 30px auto;
            padding: 20px;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .precio {
            font-size: 24px;
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #555;
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

<header>
    <h1 class="titulo">Tiya Jesupas</h1>
    <p>La mejor tienda de cabezaniperos</p>
</header>

<div class="centro">
    🦄❤️🐉
</div>

<div class="texto">
    No veas popo
</div>

<main>
    <div class="producto">
        <h2>Cabezanipero</h2>
        <p class="precio">20€</p>
        <button onclick="comprar()">Comprar</button>
    </div>

    <div class="carrito">
        <h3>Carrito</h3>
        <p>Productos: <span id="contador">0</span></p>
        <p>Total: <span id="total">0</span> €</p>
        <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>
</main>

<script>
    let contador = 0;
    let total = 0;
    const precio = 20;

    function comprar() {
        contador++;
        total += precio;

        document.getElementById("contador").innerText = contador;
        document.getElementById("total").innerText = total;
    }

    function vaciarCarrito() {
        contador = 0;
        total = 0;

        document.getElementById("contador").innerText = contador;
        document.getElementById("total").innerText = total;
    }
</script>

</body>
</html>
